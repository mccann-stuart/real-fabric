packages:
  - "."

allowBuilds:
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260825.1'

overrides:
  # Bundles libheif 1.23.2, fixing GHSA-g89c-p67h-r497 and GHSA-2jg2-4ch7-h545.
  "miniflare>sharp": "0.35.4"
  # Keep Miniflare on the current Undici release; requires Node.js 22.19.0+.
  "miniflare>undici": "8.12.1"

onlyBuiltDependencies:
  - "@biomejs/biome"
  - "esbuild"
  - "workerd"

patchedDependencies:
  moqtail@0.12.1: patches/moqtail@0.12.1.patch
